openapi: 3.1.0
info:
  title: DigiPanel Core REST API
  description: Production API specification for DigiPanel Linux Server Automation, Fleet Management, and Native Billing.
  version: 1.0.0
servers:
  - url: https://panel.digihost.id/api/v1
    description: Production Panel Gateway
  - url: http://127.0.0.1:8080/api/v1
    description: Local Core Daemon
paths:
  /health:
    get:
      summary: Health check probe
      responses:
        '200':
          description: Service operational status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.0.0

  /auth/login:
    post:
      summary: Exchange credentials for an opaque session token
      description: >-
        The token is a 256-bit random value bound to a session record that holds
        the user, the role, and an expiry. The role is never read from the token.
        Failed attempts are throttled per username and validated client address,
        and every attempt is written to the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                totpCode:
                  type: string
      responses:
        '200':
          description: Session token, username, role, and remaining lifetime in seconds
        '401':
          description: Invalid credentials or invalid 2FA token
        '429':
          description: Too many failed attempts for this username and address

  /auth/logout:
    post:
      summary: Revoke the current session token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session revoked; the token no longer authenticates

  /auth/me:
    get:
      summary: Get the authenticated user profile resolved from the live session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Username, role, permissions, two-factor state, expiry, and active session count
        '401':
          description: Missing, expired, or revoked session

  /users:
    get:
      summary: List panel identities
      description: 'Optional filter: ?role=admin|reseller|user|staff. Requires users.read.'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Panel identities with role and granted permissions
        '403':
          description: Permission denied
    post:
      summary: Create a panel identity with an Argon2id hashed password
      description: Requires users.write. Role must be a known RBAC role.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [admin, reseller, user, staff]
      responses:
        '201':
          description: Identity created
        '400':
          description: Invalid role or password policy violation
        '409':
          description: Identity already exists
    put:
      summary: Rotate a panel password and revoke its sessions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Password changed and every live session revoked
        '404':
          description: Identity not found
    delete:
      summary: Delete a panel identity
      description: 'Query parameter: ?username=. The built-in administrator cannot be deleted.'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Identity removed and its sessions revoked
        '404':
          description: Identity not found

  /hosting/packages:
    get:
      summary: List hosting plans enforced by the hosting engine
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of plan definitions
    post:
      summary: Create a hosting plan
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Plan created and immediately usable by account provisioning
        '400':
          description: Invalid plan definition
        '409':
          description: Plan already exists
    put:
      summary: Replace the limits of an existing plan
      description: 'Query parameter: ?name=.'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Plan updated
        '404':
          description: Plan not found
    delete:
      summary: Delete an unused plan
      description: 'Query parameter: ?name=. A plan assigned to any account is refused.'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Plan deleted
        '409':
          description: Plan is in use by at least one account

  /hosting/accounts/package:
    post:
      summary: Move an account to another plan and re-apply plan limits
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, package]
              properties:
                username:
                  type: string
                package:
                  type: string
      responses:
        '200':
          description: Updated account record
        '404':
          description: Account or plan not found

  /hosting/accounts/usage:
    get:
      summary: Recompute measured disk, inode, and bandwidth usage for one account
      description: 'Query parameter: ?username=. A client role may only request its own account.'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account record with refreshed usage
        '403':
          description: Account is outside the caller's scope

  /system/telemetry:
    get:
      summary: Retrieve real-time server telemetry and system resources
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Telemetry data
        '401':
          description: Unauthorized

  /hosting/accounts:
    get:
      summary: List all hosting accounts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of hosting accounts
        '401':
          description: Unauthorized
    post:
      summary: Atomic creation of POSIX user, home dir, vhost, php-fpm pool, and DNS
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object                required: [domain, username, package]
              properties:
                tenantId:
                  type: string
                  description: Defaults to tenant-default when omitted
                domain:
                  type: string
                username:
                  type: string
                package:
                  type: string
                  description: Must name an existing plan; unknown plans are rejected
                phpVersion:
                  type: string
      responses:
        '201':
          description: Account created successfully
        '401':
          description: Unauthorized

  /dns/zones:
    get:
      summary: List all DNS zones
      security:
        - BearerAuth: []
      responses:
        '200':
          description: DNS zones list
        '401':
          description: Unauthorized

  /dns/zones/{domain}/records:
    get:
      summary: Retrieve all DNS records for a zone
      security:
        - BearerAuth: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DNS record list
        '401':
          description: Unauthorized
    post:
      summary: Add record to PowerDNS zone
      security:
        - BearerAuth: []
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, content, ttl]
              properties:
                type:
                  type: string
                  enum: [A, AAAA, CNAME, MX, TXT, SRV, CAA, NS, PTR]
                name:
                  type: string
                content:
                  type: string
                ttl:
                  type: integer
                  default: 3600
                priority:
                  type: integer
      responses:
        '201':
          description: Record created successfully
        '401':
          description: Unauthorized

  /billing/ledger:
    get:
      summary: Retrieve general double-entry ledger balance
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Ledger accounts, entries, and debit/credit balance
        '401':
          description: Unauthorized

  /billing/invoices:
    get:
      summary: List billing invoices
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of invoices
        '401':
          description: Unauthorized

  /cluster/fleet:
    get:
      summary: Retrieve telemetry from all connected fleet nodes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cluster fleet nodes status
        '401':
          description: Unauthorized

  /system/modules:
    get:
      summary: List installed and available system modules
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Module manifest list
        '401':
          description: Unauthorized

  /runtimes/apps:
    get:
      summary: List supervised runtime applications with live /proc metrics
      description: Requires permission runtimes.view. Status, PID, CPU, RAM, and uptime are derived from /proc at read time; no stored fabricated values.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Supervised application snapshots
        '401':
          description: Missing or invalid bearer token
    post:
      summary: Register a new supervised application
      description: Requires permission runtimes.manage. The runtime version is resolved from the detected host interpreter; caller versions are ignored.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, runtime, path, entryFile, port]
              properties:
                name:
                  type: string
                runtime:
                  type: string
                  enum: [nodejs, python, golang]
                path:
                  type: string
                  description: Absolute application directory
                entryFile:
                  type: string
                  description: Bare filename, no traversal
                port:
                  type: integer
                  minimum: 1024
                  maximum: 65535
                environment:
                  type: string
                  enum: [production, staging, development]
      responses:
        '201':
          description: Application registered
        '400':
          description: Validation error
        '401':
          description: Unauthorized
    delete:
      summary: Remove a stopped application from the registry
      description: Requires permission runtimes.manage. Refuses running applications. Application source files are never touched.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Registry entry removed
        '400':
          description: Missing id or refusal reason
        '401':
          description: Unauthorized

  /runtimes/apps/action:
    post:
      summary: Start, stop, or restart a supervised application
      description: Requires permission runtimes.manage. Start compiles Go sources with the host toolchain before spawning; every process runs in its own process group.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appId, action]
              properties:
                appId:
                  type: string
                action:
                  type: string
                  enum: [start, stop, restart]
      responses:
        '200':
          description: Post-action snapshot of the application
        '400':
          description: Unknown action or lifecycle refusal
        '401':
          description: Unauthorized

  /runtimes/apps/logs:
    get:
      summary: Tail the captured stdout and stderr of an application
      description: Requires permission runtimes.view.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Log lines captured from the application process
        '400':
          description: Missing id
        '401':
          description: Unauthorized

  /runtimes/detected:
    get:
      summary: List runtime binaries and versions detected on this host
      description: Requires permission runtimes.view.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Map of runtime kind to detected version string
        '401':
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
      description: >-
        Opaque token returned by /auth/login. It carries no claims; the server
        resolves it against the session store on every request.
